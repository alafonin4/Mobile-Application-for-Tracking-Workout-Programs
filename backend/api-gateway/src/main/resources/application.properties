spring.application.name=api-gateway
server.port=${SERVER_PORT:8083}
server.address=${SERVER_ADDRESS:0.0.0.0}
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=${LOGGING_LEVEL_GATEWAY_ROUTES:INFO}
